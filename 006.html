<!doctype html>
<html lang="de">
<head>

<title>Für Arielle · von Vanessa</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
:root{--creme:#fdf8f3;--rose:#b76e79;--rose2:#d9a3ab;--dunkel:#5c3840;--gold:#c4a062;--grau:#9c8389}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Cormorant Garamond',Georgia,serif;color:var(--dunkel);

.text{font-size:1.15rem;line-height:1.5;margin:0 0 26px;color:var(--dunkel)}
.knopf{position:relative;width:160px;height:160px;margin:6px auto 0;border-radius:50%;border:none;cursor:pointer;
 background:linear-gradient(145deg,#c9808b,#a85c68);color:#fff;font-family:inherit;font-size:1.25rem;font-weight:600;
 letter-spacing:.04em;box-shadow:0 10px 26px rgba(167,92,104,.35);transition:transform .15s}
.knopf:active{transform:scale(.96)}

.knopf.laeuft::before{animation:puls 1.6s ease-out infinite}
@keyframes puls{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.knopf svg{display:block;margin:0 auto 4px}
.knopf span{display:block}
.zeit{margin:22px 0 0;font-size:1rem;color:var(--grau);font-variant-numeric:tabular-nums}
.spur{position:relative;height:36px;margin:4px 14px 0;cursor:pointer;touch-action:none;
 -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.spur .bahn{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:#f0dfe2;border-radius:3px;overflow:hidden}
.spur .bahn i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold))}
.spur .griff{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
 background:#fff;border:2px solid var(--rose);box-shadow:0 2px 7px rgba(92,56,64,.28);transition:transform .12s}
.spur.zieht .griff{transform:scale(1.3)}
.spur:focus{outline:none}
.spur:focus-visible{outline:2px solid var(--rose2);outline-offset:4px;border-radius:10px}
.herz{margin:26px 0 0;color:var(--rose2);font-size:1.3rem;letter-spacing:.5em}
footer{margin-top:22px;font-size:.9rem;color:var(--grau)}
footer a{color:inherit}
</style>
</head>
<body>
<main>
 <div class="rahmen">
  <img class="fuer" src="fuer.png" alt="Für Arielle">
  <p class="anlass">zum 18. Geburtstag</p>
  <p class="von">eine Nachricht von</p>
  <h1>Vanessa</h1>
  
  <button class="knopf" id="k" onclick="s()" aria-label="Anhören">
    <svg id="ik" viewBox="0 0 24 24" width="54" height="54" fill="currentColor" aria-hidden="true"><path id="ip" d="M8 5.5v13l11-6.5z"/></svg>
    <span id="kt">Anhören</span>
  </button>
  <p class="zeit"><span id="z">0:00</span> / <span id="d">–:––</span></p>
  <div class="spur" id="sp" role="slider" tabindex="0" aria-label="Stelle in der Nachricht"
       aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
    <div class="bahn"><i id="b"></i></div><span class="griff" id="g"></span>
  </div>
  <audio id="a" preload="auto">
    <source src="audio/006.m4a" type="audio/mp4">
    <source src="audio/006.mp3" type="audio/mpeg">
  </audio>
  <p class="herz">♥ ♥ ♥</p>
 </div>
 <footer>Nachricht 006 · <a href="./">alle Nachrichten</a></footer>
</main>
<script>

    d=document.getElementById('d'),b=document.getElementById('b'),sp=document.getElementById('sp'),

function zeige(t){var D=dauer(),p=D?Math.min(100,Math.max(0,100*t/D)):0;
 b.style.width=p+'%';g.style.left=p+'%';z.textContent=f(t);
 sp.setAttribute('aria-valuenow',Math.round(t));sp.setAttribute('aria-valuemax',Math.round(D));
 sp.setAttribute('aria-valuetext',f(t)+' von '+f(D))}

function stelle(e){var r=sp.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*dauer()}
function springe(t){var D=dauer();if(!D)return;a.currentTime=Math.min(D-0.05,Math.max(0,t));zeige(a.currentTime)}
sp.addEventListener('pointerdown',function(e){if(!dauer()){a.load();return}zieht=true;sp.classList.add('zieht');
 try{sp.setPointerCapture(e.pointerId)}catch(_){}zeige(stelle(e));e.preventDefault()});
sp.addEventListener('pointermove',function(e){if(zieht)zeige(stelle(e))});
sp.addEventListener('pointerup',function(e){if(!zieht)return;zieht=false;sp.classList.remove('zieht');springe(stelle(e))});
sp.addEventListener('pointercancel',function(){zieht=false;sp.classList.remove('zieht');zeige(a.currentTime)});

 else if(e.key==='Home')t=0;else if(e.key==='End')t=dauer();else return;e.preventDefault();springe(t)});
a.addEventListener('loadedmetadata',function(){dz();zeige(a.currentTime)});
a.addEventListener('durationchange',function(){dz();zeige(a.currentTime)});dz();

var P={play:'M8 5.5v13l11-6.5z',pause:'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z',

a.addEventListener('seeked',function(){if(a.paused&&!a.ended)z2(a.currentTime>0.5?'Weiter':'Anhören','play')});
</script>
</body>
</html>
