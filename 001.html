<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Für Arielle · von Oma Gretl</title>
<meta name="theme-color" content="#fdf8f3">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap');
:root{--creme:#fdf8f3;--rose:#b76e79;--rose2:#d9a3ab;--dunkel:#5c3840;--gold:#c4a062;--grau:#9c8389}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Cormorant Garamond',Georgia,serif;color:var(--dunkel);
 background:var(--creme);background-image:radial-gradient(circle at 15% 10%,#fbe6e9 0,transparent 45%),
 radial-gradient(circle at 85% 90%,#f6e9d2 0,transparent 45%);display:flex;align-items:center;justify-content:center}
main{text-align:center;padding:40px 24px 32px;max-width:440px;width:100%}
.rahmen{background:rgba(255,255,255,.75);border:1px solid #efd9dd;border-radius:28px;padding:36px 26px 30px;
 box-shadow:0 14px 40px rgba(92,56,64,.10)}
.fuer{font-family:'Great Vibes',cursive;font-size:3.1rem;line-height:1;color:var(--rose);margin:0}
.anlass{font-size:1.05rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:8px 0 26px}
.von{font-size:1.05rem;color:var(--grau);margin:0;font-style:italic}
h1{font-weight:600;font-size:2rem;margin:4px 0 6px;line-height:1.15}
.text{font-size:1.15rem;line-height:1.5;margin:0 0 26px;color:var(--dunkel)}
.knopf{position:relative;width:160px;height:160px;margin:6px auto 0;border-radius:50%;border:none;cursor:pointer;
 background:linear-gradient(145deg,#c9808b,#a85c68);color:#fff;font-family:inherit;font-size:1.25rem;font-weight:600;
 letter-spacing:.04em;box-shadow:0 10px 26px rgba(167,92,104,.35);transition:transform .15s}
.knopf:active{transform:scale(.96)}
.knopf::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--rose2);opacity:.7}
.knopf.laeuft::before{animation:puls 1.6s ease-out infinite}
@keyframes puls{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.knopf span{display:block;font-size:2rem;line-height:1;margin-bottom:6px}
.zeit{margin:22px 0 0;font-size:1rem;color:var(--grau);font-variant-numeric:tabular-nums}
.balken{height:4px;background:#f0dfe2;border-radius:2px;margin:10px 20px 0;overflow:hidden}
.balken i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold))}
.herz{margin:26px 0 0;color:var(--rose2);font-size:1.3rem;letter-spacing:.5em}
footer{margin-top:22px;font-size:.9rem;color:var(--grau)}
footer a{color:inherit}
</style>
</head>
<body>
<main>
 <div class="rahmen">
  <p class="fuer">Für Arielle</p>
  <p class="anlass">zum 18. Geburtstag</p>
  <p class="von">eine Nachricht von</p>
  <h1>Oma Gretl</h1>
  <p class="text">Zum Reinhören: so klingt eine Nachricht im Album. Alles Liebe zum Achtzehnten!</p>
  <button class="knopf" id="k" onclick="s()"><span>▶</span>Anhören</button>
  <p class="zeit"><span id="z">0:00</span> / <span id="d">–:––</span></p>
  <div class="balken"><i id="b"></i></div>
  <audio id="a" preload="auto">
    <source src="audio/001.m4a" type="audio/mp4">
    <source src="audio/001.mp3" type="audio/mpeg">
  </audio>
  <p class="herz">♥ ♥ ♥</p>
 </div>
 <footer>Nachricht 001 · <a href="./">alle Nachrichten</a></footer>
</main>
<script>
var a=document.getElementById('a'),k=document.getElementById('k'),z=document.getElementById('z'),
    d=document.getElementById('d'),b=document.getElementById('b');
function f(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function s(){a.paused?a.play():a.pause()}
a.addEventListener('loadedmetadata',function(){d.textContent=f(a.duration)});
a.addEventListener('timeupdate',function(){z.textContent=f(a.currentTime);b.style.width=(100*a.currentTime/a.duration)+'%'});
a.addEventListener('play',function(){k.innerHTML='<span>❚❚</span>Pause';k.classList.add('laeuft')});
a.addEventListener('pause',function(){k.innerHTML='<span>▶</span>Weiter';k.classList.remove('laeuft')});
a.addEventListener('ended',function(){k.innerHTML='<span>↻</span>Nochmal';k.classList.remove('laeuft')});
</script>
</body>
</html>
