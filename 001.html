<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Für Arielle · von Oma Gretl</title>
<meta name="theme-color" content="#fdf8f3">
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,600;1,400&display=swap');
:root{--creme:#fdf8f3;--rose:#b76e79;--rose2:#d9a3ab;--dunkel:#5c3840;--gold:#c4a062;--grau:#9c8389}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,'Gelasio',serif;color:var(--dunkel);background:var(--creme);
 display:flex;align-items:center;justify-content:center}
main{text-align:center;padding:18px 16px;max-width:460px;width:100%}
.rahmen{position:relative;background:var(--creme);border:3px solid var(--gold);border-radius:34px;padding:34px 24px 26px}
.rahmen::before{content:"";position:absolute;inset:9px;border:1px solid var(--rose);border-radius:26px;pointer-events:none}
.fuer{margin:0 auto 6px;width:min(78%,300px);display:block}
.anlass{font-style:italic;font-size:1.35rem;color:var(--gold);margin:0 0 24px}
.von{font-style:italic;font-size:1.05rem;color:var(--grau);margin:0}
h1{font-weight:normal;font-size:1.9rem;margin:2px 0 8px;line-height:1.15}
.text{font-size:1.05rem;line-height:1.5;margin:0 0 24px}
.knopf{position:relative;width:160px;height:160px;margin:4px auto 0;border-radius:50%;border:none;cursor:pointer;
 background:var(--rose);color:#fff;font-family:inherit;font-size:1.2rem;letter-spacing:.03em;
 box-shadow:0 10px 26px rgba(167,92,104,.3);transition:transform .15s}
.knopf:active{transform:scale(.96)}
.knopf::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--gold);opacity:.8}
.knopf.laeuft::before{animation:puls 1.6s ease-out infinite}
@keyframes puls{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.knopf svg{display:block;margin:0 auto 4px}
.knopf span{display:block;font-size:1.15rem}
.hinweis{font-style:italic;font-size:1.2rem;margin:26px 0 0}
.zeit{margin:10px 0 0;font-size:1rem;color:var(--grau);font-variant-numeric:tabular-nums}
.balken{height:3px;background:#efdfe2;border-radius:2px;margin:10px 30px 0;overflow:hidden}
.balken i{display:block;height:100%;width:0;background:var(--rose)}
.nr{margin:22px 0 0;color:var(--gold);font-size:1.05rem}
.nr b{font-weight:normal;color:var(--rose);margin-left:8px}
footer{margin-top:14px;font-size:.9rem;color:var(--grau)}
footer a{color:inherit}
</style>
</head>
<body>
<main>
 <div class="rahmen">
  <img class="fuer" src="fuer.png" alt="Für Arielle">
  <p class="anlass">zum 18. Geburtstag</p>
  <p class="von">eine Nachricht von</p>
  <h1>Oma Gretl</h1>
  <p class="text">Zum Reinhören: so klingt eine Nachricht im Album. Alles Liebe zum Achtzehnten!</p>
  <button class="knopf" id="k" onclick="s()" aria-label="Anhören">
    <svg id="ik" viewBox="0 0 24 24" width="54" height="54" fill="currentColor" aria-hidden="true"><path id="ip" d="M8 5.5v13l11-6.5z"/></svg>
    <span id="kt">Anhören</span>
  </button>
  <p class="hinweis">Tippen und anhören</p>
  <p class="zeit"><span id="z">0:00</span> / <span id="d">–:––</span></p>
  <div class="balken"><i id="b"></i></div>
  <audio id="a" preload="auto">
    <source src="audio/001.m4a" type="audio/mp4">
    <source src="audio/001.mp3" type="audio/mpeg">
  </audio>
  <p class="nr">Nachricht 001<b>♥</b></p>
 </div>
 <footer><a href="./">alle Nachrichten</a></footer>
</main>
<script>
var a=document.getElementById('a'),k=document.getElementById('k'),z=document.getElementById('z'),
    d=document.getElementById('d'),b=document.getElementById('b');
function f(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function s(){a.paused?a.play():a.pause()}
function dz(){if(a.duration&&isFinite(a.duration))d.textContent=f(a.duration)}
a.addEventListener('loadedmetadata',dz);a.addEventListener('durationchange',dz);dz();
a.addEventListener('timeupdate',function(){dz();z.textContent=f(a.currentTime);b.style.width=(100*a.currentTime/a.duration)+'%'});
var P={play:'M8 5.5v13l11-6.5z',pause:'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z',
 wieder:'M12 5a7 7 0 1 1-6.3 4h2.2A5 5 0 1 0 12 7v3l-4.5-4L12 2z'};
function z2(t,icon){document.getElementById('kt').textContent=t;document.getElementById('ip').setAttribute('d',P[icon]);}
a.addEventListener('play',function(){z2('Pause','pause');k.classList.add('laeuft')});
a.addEventListener('pause',function(){z2('Weiter','play');k.classList.remove('laeuft')});
a.addEventListener('ended',function(){z2('Nochmal','wieder');k.classList.remove('laeuft')});
</script>
</body>
</html>
